<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veritas Code</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <input type="file" id="filePicker" style="display: none;">
  <input type="file" id="folderPicker" webkitdirectory directory style="display: none;">

  <header class="app-header">
    <span class="app-title">Veritas Code</span>
    <button class="menu-item">File</button>
    <button class="menu-item">Edit</button>
    <button class="menu-item">View</button>
    <button class="menu-item">Settings</button>
    <button class="menu-item">Help</button>
  </header>

  <div class="app-body">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <svg class="logo-icon" id="logoBtn" viewBox="0 0 24 24">
          <path d="M12 2L2 19h20L12 2zm0 4l6.5 11h-13L12 6z"/>
        </svg>
        <span class="sidebar-title" id="notesToggleBtn">Tree</span>
        <div class="sidebar-actions">
          <button class="action-btn">➕</button>
          <button class="action-btn">📁</button>
        </div>
      </div>

      <div class="tree-view"></div>
    </aside>

    <main class="workspace">
      <div class="editor-header">
        <span id="activeFileName" style="padding-left: 10px; font-weight: 500;">No file open</span>
        <div class="header-tools">
          <button class="tool-icon">✦</button>
          <button class="tool-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7v6h6"></path>
              <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
            </svg>
          </button>
          <button class="tool-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 7v6h-6"></path>
              <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path>
            </svg>
          </button>
          <button class="versioncontrol-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="3" x2="6" y2="15"></line>
              <circle cx="18" cy="6" r="3"></circle>
              <circle cx="6" cy="18" r="3"></circle>
              <path d="M18 9a9 9 0 0 1-9 9"></path>
            </svg>
          </button>
          <button class="tool-icon">&lt;/&gt;</button>
          <button class="tool-icon">▶</button>
          <button class="tool-icon" id="saveFileBtn" title="Save File (Ctrl+S)">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <div class="editor-grid-container">
        <div class="text-canvas" contenteditable="true" id="textCanvas"></div>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
